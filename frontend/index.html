<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pitchside Pot — On-chain Fantasy Contests</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;500;600&family=Familjen+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--motion-fast:200ms;--motion-base:600ms;--motion-slow:1100ms;--t:#052c33;--t2:#0a3f48;--t3:#0f5662;--chalk:#f3f1ea;--sal:#ff6f61;--line:#ffffff26}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{background:var(--t);color:var(--chalk);font-family:'Familjen Grotesk',sans-serif;overflow-x:hidden;line-height:1.5;
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:80px 80px;background-attachment:fixed;background-blend-mode:soft-light}
.mono{font-family:'IBM Plex Mono',monospace}a{color:inherit}
.top{position:sticky;top:0;z-index:30;background:var(--t);border-bottom:2px solid var(--chalk);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 3vw}
.lg{font:900 1.7rem 'Big Shoulders Display',sans-serif;text-transform:uppercase;letter-spacing:.02em;text-decoration:none}.lg b{color:var(--sal)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font:500 .72rem 'IBM Plex Mono',monospace;color:var(--chalk);border:1.5px solid var(--chalk);padding:7px 10px;background:transparent;text-decoration:none;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip.hot{background:var(--sal);border-color:var(--sal);color:var(--t)}
select.chip option{color:#000}
.chip b{color:var(--sal)}
.hero{padding:60px 3vw 40px;display:grid;grid-auto-flow:dense;grid-template-columns:repeat(12,1fr);gap:20px;position:relative}
.hero h1{grid-column:1/10;font:900 clamp(4rem,15vw,15rem)/.8 'Big Shoulders Display',sans-serif;text-transform:uppercase;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:transparent;-webkit-text-stroke:2px var(--chalk)}
.hero h1 .s{color:var(--sal)}
.board{grid-column:7/13;grid-row:2;background:#021a1f;border:3px solid var(--chalk);padding:18px 22px;margin-top:-30px;position:relative;z-index:2}
.board .l{font:500 .7rem 'IBM Plex Mono',monospace;letter-spacing:.2em;color:#9fc7cb}
.digits{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.dg{font:700 clamp(2.6rem,6vw,4.6rem)/1 'IBM Plex Mono',monospace;background:#000;color:var(--sal);padding:4px 10px;border-bottom:3px solid #0008;min-width:.72em;text-align:center;overflow:hidden;position:relative;text-shadow:0 0 18px #ff6f6188}
.dg.dot{background:transparent;padding:4px 0;min-width:0}
.hero .copy{grid-column:1/6;grid-row:2;align-self:start;max-width:40ch}
.launch{display:inline-block;font:600 .85rem 'IBM Plex Mono',monospace;background:var(--chalk);color:var(--t);padding:8px 12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px}
.tick{background:var(--sal);color:var(--t);overflow:hidden;border-block:2px solid var(--chalk)}
.tick div{display:flex;gap:46px;width:max-content;animation:tk 30s linear infinite;padding:10px 0;font:900 1.5rem 'Big Shoulders Display',sans-serif;text-transform:uppercase}
.tick:hover div{animation-play-state:paused}
@keyframes tk{to{transform:translateX(-50%)}}
section{padding:80px 3vw}
h2{font:900 clamp(3rem,9vw,8rem)/.85 'Big Shoulders Display',sans-serif;text-transform:uppercase;margin-bottom:34px}
h2 span{color:var(--sal)}
.lab{font:500 .72rem 'IBM Plex Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#9fc7cb;margin-bottom:8px}
.tbl{border-top:3px solid var(--chalk)}
.hd,.rw{display:grid;grid-template-columns:70px 1.8fr .8fr .8fr .8fr 150px;gap:14px;align-items:center;padding:16px 6px}
.hd{font:500 .68rem 'IBM Plex Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:#9fc7cb;border-bottom:1px solid var(--chalk)}
.rw{border-bottom:1px solid var(--line);position:relative;overflow:hidden;transition:background .3s,padding .3s;isolation:isolate}
.rw:before{content:"";position:absolute;inset:0;background:var(--t3);transform:scaleX(var(--p,0));transform-origin:left;transition:transform 1.3s cubic-bezier(.2,.8,.2,1);z-index:-1}
.rw:hover{padding-left:20px;background:#ffffff0a}
.rw .no{font:900 2.6rem 'Big Shoulders Display',sans-serif;color:var(--sal);line-height:1}
.rw .nm{font:900 clamp(1.5rem,3vw,2.5rem)/1 'Big Shoulders Display',sans-serif;text-transform:uppercase}
.rw .v{font:600 1rem 'IBM Plex Mono',monospace}.rw small{display:block;font:400 .65rem 'IBM Plex Mono',monospace;color:#9fc7cb;letter-spacing:.1em;text-transform:uppercase}
.st{font:600 .7rem 'IBM Plex Mono',monospace;padding:4px 8px;border:1.5px solid var(--chalk);display:inline-block}.st.open{background:var(--chalk);color:var(--t)}.st.res{background:var(--sal);border-color:var(--sal);color:var(--t)}
button.go,.fm button{font:700 1rem 'Big Shoulders Display',sans-serif;text-transform:uppercase;letter-spacing:.06em;background:var(--sal);color:var(--t);border:0;padding:11px 16px;cursor:pointer;transition:transform .2s,background .2s}
button.go:hover,.fm button:hover{background:var(--chalk);transform:translate(-3px,-3px);box-shadow:3px 3px 0 var(--sal)}
button:disabled{opacity:.35;cursor:not-allowed}
.locker{display:grid;grid-template-columns:repeat(3,1fr)gap:0;border:3px solid var(--chalk);background:#021a1f}
.fm{padding:26px;border-right:1px solid var(--chalk);display:grid;gap:12px;align-content:start}.fm:last-child{border:0}
.fm h5{font:900 2rem 'Big Shoulders Display',sans-serif;text-transform:uppercase}.fm h5 i{font:500 .7rem 'IBM Plex Mono',monospace;color:var(--sal);display:block;font-style:normal;letter-spacing:.1em}
.fm label{font:500 .66rem 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#9fc7cb;display:grid;gap:4px}
.fm input{font:500 1rem 'IBM Plex Mono',monospace;background:var(--t);color:var(--chalk);border:1.5px solid var(--chalk);padding:10px;width:100%;outline:0}.fm input:focus{border-color:var(--sal)}
.fm button{justify-self:start}
.note{font:400 .72rem 'IBM Plex Mono',monospace;color:#9fc7cb}
.big{padding:60px 3vw;font:900 clamp(2rem,6vw,5rem)/.9 'Big Shoulders Display',sans-serif;text-transform:uppercase;border-top:3px solid var(--chalk)}
footer{display:flex;flex-wrap:wrap;gap:8px 18px;padding:24px 3vw 40px;font:400 .72rem 'IBM Plex Mono',monospace;border-top:1px solid var(--line);color:#9fc7cb}
footer b{color:var(--chalk)}footer a{color:var(--sal)}
#toasts{position:fixed;bottom:16px;left:16px;z-index:99;display:grid;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--chalk);color:var(--t);padding:12px 16px;border-left:8px solid var(--t3);font:600 .78rem 'IBM Plex Mono',monospace;transform:translateX(-30px);opacity:0;transition:.35s}.toast.in{transform:none;opacity:1}.toast.ok{border-color:#1fa36a}.toast.err{border-color:#d62f2f}.toast.warn{border-color:#d68a1a}
.cur{position:fixed;z-index:99;pointer-events:none;width:20px;height:20px;border-radius:50%;background:var(--sal);transform:translate(-50%,-50%);transition:width .25s,height .25s;mix-blend-mode:screen}
.cur:after{content:"";position:absolute;inset:-12px;border:1px solid var(--chalk);border-radius:50%}
.cur.big{width:44px;height:44px}
.rv{opacity:0;transform:translateX(-50px);clip-path:inset(0 100% 0 0);transition:1s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none;clip-path:inset(0 0 0 0)}
@media(max-width:860px){.hero h1{grid-column:1/-1}.board,.hero .copy{grid-column:1/-1;grid-row:auto;margin-top:0}.hd{display:none}.rw{grid-template-columns:50px 1fr 1fr;row-gap:10px}.rw .nm{grid-column:2/4}.rw .act{grid-column:1/-1}.locker{grid-template-columns:1fr}.fm{border-right:0;border-bottom:1px solid var(--chalk)}.cur{display:none}}
@media(hover:none){.cur{display:none}}

@media(prefers-reduced-motion:reduce){.rv{transition:none!important;opacity:1;transform:none!important}*{animation:none!important}}
